name: Contract security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
      - run: npm ci
      - name: Discover and run contract tests
        run: |
          set -euo pipefail
          node scripts/foundry.mjs forge test --root contracts --list | tee discovered-tests.txt
          grep -q 'testDigitalLifecycleAndReplay' discovered-tests.txt
          FOUNDRY_PROFILE=ci npm run contracts:test
      - name: Install pinned analyzer
        run: pip install slither-analyzer==0.11.3
      - name: Analyze contracts (errors and missing reports fail)
        working-directory: contracts
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/@foundry-rs/forge-linux-amd64/bin:$PATH"
          slither . --filter-paths 'node_modules|test' --exclude-dependencies --fail-high --json slither-report.json
          python ../scripts/check-slither.py slither-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-analysis
          path: contracts/slither-report.json
          if-no-files-found: error
