[profile.default]
src = "src"
out = "out"
libs = ["../node_modules"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/", "ethr-did-registry/=../node_modules/ethr-did-registry/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true

[profile.ci.fuzz]
runs = 1000
